<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meade Performance — 10 Ways in 10 Days to Improve Your S&C</title>
<meta name="description" content="Free guide: 10 ways in 10 days to improve your S&C. Join the Meade Performance list." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=EB+Garamond:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808;
    --surface:#111110;
    --rule:#2A2A28;
    --ink:#F5F2EC;
    --ink-body:#CFCBC3;
    --ink-muted:#9A9A94;
    --gold:#B39457;
    --action-fill:#F5F2EC;
    --action-ink:#080808;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }

  body{
    background:var(--bg);
    color:var(--ink-body);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  ::selection{ background:var(--gold); color:#080808; }
  a{ color:inherit; }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:1px;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
  }

  .screen{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:32% 12%;
    filter:grayscale(1) contrast(1.08) brightness(1.02);
  }

  .hero-overlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(8,8,8,0.35) 0%, rgba(8,8,8,0.55) 30%, rgba(8,8,8,0.82) 60%, rgba(8,8,8,0.94) 100%);
  }

  .brandmark{
    position:absolute;
    top:clamp(10px, 2svh, 18px);
    left:clamp(14px, 4vw, 22px);
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:0.8;
    user-select:none;
  }
  .brandmark .meade{
    font-family:'Inter Tight', sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .brandmark .performance{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:7px;
    color:var(--ink);
    margin-top:1px;
  }

  main{
    position:relative;
    z-index:10;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: clamp(8px, 1.4svh, 16px) 20px clamp(14px, 2.4svh, 22px);
    min-height:0;
  }

  .content{
    width:100%;
    max-width:440px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .kicker{
    display:block;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 clamp(6px, 1.2svh, 10px);
  }

  h1{
    font-family:'Inter Tight', sans-serif;
    font-weight:800;
    letter-spacing:-0.025em;
    line-height:1.05;
    font-size:clamp(1.5rem, 5vw, 2.3rem);
    color:var(--ink);
    margin:0 0 clamp(5px, 0.9svh, 8px);
    text-transform:uppercase;
  }

  .form-kicker{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 4px;
    text-align:center;
  }

  .arrow-down{
    display:block;
    width:14px;
    height:14px;
    margin:0 auto clamp(8px, 1.4svh, 12px);
    color:var(--ink-muted);
  }

  .signup{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  #ghl-embed{
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #ghl-embed iframe{
    display:block;
    min-height:360px;
  }

  .field{
    width:100%;
    height:46px;
    background:rgba(17,17,16,0.65);
    border:1.5px solid var(--rule);
    border-radius:2px;
    padding:0 16px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:400;
    text-align:center;
    transition:border-color 180ms cubic-bezier(0.34,1.56,0.64,1);
  }
  .field::placeholder{ color:var(--ink-muted); }
  .field:hover{ border-color:#4a4a46; }
  .field:focus{ border-color:var(--ink); outline:none; }

  .btn-primary{
    height:46px;
    width:100%;
    background:var(--action-fill);
    color:var(--action-ink);
    border:none;
    border-radius:2px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform 180ms cubic-bezier(0.34,1.56,0.64,1), opacity 180ms ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); opacity:0.92; }
  .btn-primary:active{ transform:translateY(0px); opacity:0.85; }

  .fineprint{
    margin:12px 0 0;
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    line-height:1.5;
    color:var(--ink-muted);
  }

  @media (max-height: 760px){
    main{ padding-top:6px; }
    .kicker{ margin-bottom:4px; }
    .form-kicker{ margin-bottom:5px; }
  }
</style>
</head>
